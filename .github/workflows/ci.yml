name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

  api:
    # MLX only runs on Apple Silicon.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.lock
      - run: pip install -r api/requirements.lock
      - run: python -m pytest
        working-directory: api

  # Unsigned build; catches PyInstaller/Tauri breakage that the tests cannot.
  build:
    needs: [frontend, api]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      # build.sh expects the venv at the repo root.
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r api/requirements.lock
          npm ci --prefix frontend
      - run: scripts/build.sh
      - name: Check bundle output
        run: |
          BUNDLE=frontend/src-tauri/target/aarch64-apple-darwin/release/bundle
          test -d "$BUNDLE/macos/Music Recs.app"
          ls "$BUNDLE"/dmg/*.dmg
      - name: Smoke test the frozen API
        run: |
          DATA_DIR="$(mktemp -d)"
          MUSIC_RECS_PORT=18765 MUSIC_RECS_DATA_DIR="$DATA_DIR" api/dist/music-recs-api/music-recs-api &
          PID=$!
          trap 'kill $PID' EXIT
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:18765/api/songs >/dev/null && exit 0
            sleep 2
          done
          echo "Frozen API did not respond" >&2
          exit 1
