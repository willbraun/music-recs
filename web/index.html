<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>music-recs</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header>
			<h1>music-recs</h1>
			<nav>
				<button type="button" data-view="run" class="active">Run</button>
				<button type="button" data-view="history">History</button>
			</nav>
		</header>

		<main>
			<section id="run">
				<form id="run-form">
					<label>Query <input name="query" required maxlength="200" placeholder="indie rock" /></label>
					<label>Count <input name="count" type="number" min="1" max="50" value="3" required /></label>
					<button type="submit">Find songs</button>
				</form>
				<p id="status" role="status"></p>
				<ul id="results" class="songs"></ul>
			</section>

			<section id="history" hidden>
				<p id="history-status" role="status"></p>
				<ul id="history-list" class="songs"></ul>
			</section>
		</main>

		<script src="app.js"></script>
	</body>
</html>
